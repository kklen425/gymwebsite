name: Build Muscle First APK

on:
  push:
    branches:
      - chatgpt-muscle-first-apk
    paths-ignore:
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build genuine Android debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare direct-download APK
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/Muscle-First-v2.0-Editable.apk
          ls -lh releases/Muscle-First-v2.0-Editable.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muscle-first-v2-editable-apk
          path: releases/Muscle-First-v2.0-Editable.apk
          if-no-files-found: error

      - name: Publish APK to branch for direct download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/Muscle-First-v2.0-Editable.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish verified Muscle First v2.0 APK [skip ci]"
            git push origin HEAD:chatgpt-muscle-first-apk
          fi
