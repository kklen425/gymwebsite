<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Muscle First v2</title><style>
:root{--bg:#0b0f14;--p:#121923;--p2:#18212d;--l:#263241;--t:#f5f7fa;--m:#a9b4c2;--b:#7dd3fc;--g:#86efac;--y:#fde68a;--r:#fca5a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.app{max-width:760px;margin:auto;padding:14px 13px 110px}.head{position:sticky;top:0;z-index:10;background:rgba(11,15,20,.97);padding:14px 0 10px}h1{font-size:24px;margin:0}.sub{color:var(--m);font-size:12px;margin-top:2px}.tabs,.views{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.tab,.view,.btn{border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:11px;padding:10px;font-weight:800}.tab.on,.view.on,.primary{background:var(--b)!important;color:#061018!important;border-color:transparent!important}.title{display:flex;justify-content:space-between;align-items:end;margin:11px 2px}.title h2{margin:0;font-size:18px}.tag{font-size:11px;color:var(--m)}.card,.box{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:12px;margin:9px 0}.name{font-weight:900}.meta{font-size:11px;color:var(--m);margin-top:5px}.cue{font-size:12px;color:var(--m);margin-top:7px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}.field{display:block;font-size:11px;color:var(--m)}input,textarea,select{width:100%;margin-top:4px;background:#0f151e;border:1px solid var(--l);color:var(--t);border-radius:9px;padding:9px;font:inherit;font-size:13px}textarea{min-height:90px;resize:vertical}.setgrid{display:grid;gap:6px;margin-top:10px}.setrow{display:grid;grid-template-columns:32px 1fr 1fr 54px;gap:6px;align-items:center}.setn{font-size:11px;color:var(--m);text-align:center}.actions{display:flex;gap:7px;margin-top:9px}.actions .btn{flex:1}.done{opacity:.55}.done .primary{background:var(--g)!important}.vol{display:grid;grid-template-columns:78px 1fr 58px;gap:7px;align-items:center;margin:7px 0;font-size:11px}.bar{height:9px;background:#0f151e;border:1px solid var(--l);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--b)}.danger{color:var(--r)}.green{color:var(--g)}.muted{font-size:11px;color:var(--m);line-height:1.45}.hide{display:none}.timer{position:fixed;bottom:9px;left:50%;transform:translateX(-50%);width:min(730px,calc(100% - 18px));display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;background:rgba(18,25,35,.98);border:1px solid var(--l);border-radius:15px;padding:8px;z-index:20}.timer small{display:block;color:var(--m);font-size:10px}.timer strong{font-size:18px}.timer button{border:0;border-radius:9px;padding:9px 10px;font-weight:900;background:var(--p2);color:var(--t)}.timer .go{background:var(--b);color:#061018}.full{width:100%}.code{min-height:180px;font-family:monospace;font-size:11px}.notice{border-left:3px solid var(--g)}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.actions{flex-wrap:wrap}}
</style></head><body><div class="app"><div class="head"><h1>Muscle First <span style="font-size:10px;color:var(--g)">v2.0</span></h1><div class="sub">Editable Programme Engine · offline</div><div class="views"><button class="view on" data-v="train">訓練</button><button class="view" data-v="edit">改課表</button><button class="view" data-v="code">課表 Code</button></div><div class="tabs"><button class="tab on" data-d="A">DAY A</button><button class="tab" data-d="B">DAY B</button><button class="tab" data-d="C">DAY C</button></div></div><div id="train"></div><div id="edit" class="hide"></div><div id="code" class="hide"></div></div><div class="timer"><div><small>Rest timer</small><strong id="clock">02:00</strong></div><button id="q90">90s</button><button id="tbtn" class="go">開始</button></div><script>
const MUS=['Chest','Back','Side Delt','Front Delt','Rear Delt','Biceps','Triceps','Quads','Hamstrings','Calves','Abs','Other'];
const DEF={format:'muscle-first-plan',version:2,name:'Science/S&C baseline',days:{A:{title:'Upper Chest + Lat Width',cardio:'15–20 min · 5.8–6.5 km/h · incline 1–3% · RPE 3–4',x:[['a1','Incline DB Press','Chest',3,'6–10','1–2',165,'Bench 約20–30°；完整舒服 ROM。'],['a2','Lat Pulldown / Pull-up','Back',3,'6–10','1–2',150,'手肘向腰方向拉；頂部俾 lat 伸展。'],['a3','Chest Press Machine','Chest',2,'8–12','1–2',150,'水平或輕微 decline/converging；handles 約中胸。'],['a4','Leg Press / Squat','Quads',3,'6–10','1–2',180,'穩定完整 ROM。'],['a5','Chest-Supported Row','Back',3,'8–12','1–2',150,'較闊 neutral/MAG；手肘約45–60°。'],['a6','Cable Lateral Raise','Side Delt',3,'12–20','0–2',105,'唔聳膊；控制離心。'],['a7','Leg Curl','Hamstrings',2,'10–15','1–2',105,'控制完整 ROM。'],['a8','Preacher / Cable Curl','Biceps',2,'8–12','0–2',105,'手臂固定，唔借腰。'],['a9','Overhead Cable Triceps Extension','Triceps',2,'10–15','0–2',105,'上臂穩定；感受 long head stretch。'],['a10','Calf Raise','Calves',2,'8–15','1–2',105,'底部 stretch。']]},B:{title:'Chest + Complete Back + Shoulder',cardio:'8–12 min · 5.5–6.2 km/h · incline 0–2% · RPE 2–3',x:[['b1','Flat Machine / DB Chest Press','Chest',3,'6–10','1–2',165,'Day B 用 flat/general press。'],['b2','Seated Cable Row','Back',2,'8–12','1–2',150,'手肘稍向外，偏 mid/upper back。'],['b3','Single-arm Cable Lat Pulldown','Back',2,'8–12','1–2',120,'手肘向髖骨方向。'],['b4','Romanian Deadlift','Hamstrings',3,'6–10','1–2',180,'Hip hinge；hamstring stretch。'],['b5','Shoulder Press','Front Delt',2,'6–10','1–2',150,'穩定 ROM。'],['b6','Cable Lateral Raise','Side Delt',3,'12–20','0–2',105,'高質量 reps。'],['b7','Rear-Delt Fly','Rear Delt',2,'12–20','0–2',90,'控制離心。'],['b8','Bayesian / Incline Curl','Biceps',2,'10–15','0–2',105,'長肌位 curl。'],['b9','Triceps Pressdown','Triceps',2,'8–15','0–2',105,'手肘穩定。'],['b10','Abs','Abs',2,'8–15','1–2',75,'Cable crunch / hanging knee raise。']]},C:{title:'Back Thickness + Upper Chest',cardio:'10–15 min · 5.8–6.5 km/h · incline 1–3% · RPE 3–4',x:[['c1','Incline Smith / Machine Press','Chest',3,'8–12','1–2',150,'上胸優先。'],['c2','Chest-Supported T-Bar / Machine Row','Back',3,'8–12','1–2',150,'主力背厚；唔借腰。'],['c3','Lat Pulldown / Pull-up','Back',2,'8–12','1–2',150,'可與 Day A 用不同 grip。'],['c4','Bulgarian Split Squat','Quads',3,'8–12/leg','1–2',150,'單腳 hypertrophy + athletic base。'],['c5','Pec Deck / Cable Fly','Chest',2,'10–15','0–2',105,'控制 stretch。'],['c6','Cable Lateral Raise','Side Delt',3,'12–20','0–2',105,'高質量 reps。'],['c7','Hammer / Cable Curl','Biceps',2,'10–15','0–2',105,'補 brachialis / biceps。'],['c8','Overhead / Cable Triceps Extension','Triceps',2,'10–15','0–2',105,'控制 stretch。'],['c9','Optional Abs / Calves','Other',2,'8–15','1–2',90,'如 session 太長可跳過。']]}}};
let p=load(),day=localStorage.getItem('mf2-day')||'A',view='train';function cp(x){return JSON.parse(JSON.stringify(x))}function valid(o){return o&&o.days&&['A','B','C'].every(d=>o.days[d]&&Array.isArray(o.days[d].x))}function load(){try{let o=JSON.parse(localStorage.getItem('mf2-plan'));if(valid(o))return o}catch(e){}return cp(DEF)}function save(){localStorage.setItem('mf2-plan',JSON.stringify(p))}function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function lk(id,s,f){return`mf2-${id}-${s}-${f}`}function dk(id){return`mf2done-${id}`}function rest(s){return s%60?`${Math.floor(s/60)}m ${s%60}s`:`${s/60} min`}
function setView(v){view=v;document.querySelectorAll('.view').forEach(b=>b.classList.toggle('on',b.dataset.v===v));['train','edit','code'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==v));render()}function setDay(d){day=d;localStorage.setItem('mf2-day',d);render();scrollTo(0,0)}
function card(x,i){let[id,n,m,sets,reps,rir,rs,cue]=x,rows='';for(let s=1;s<=sets;s++)rows+=`<div class="setrow"><span class="setn">S${s}</span><input data-k="${lk(id,s,'w')}" class="log" inputmode="decimal" placeholder="kg"><input data-k="${lk(id,s,'r')}" class="log" inputmode="numeric" placeholder="reps"><input data-k="${lk(id,s,'i')}" class="log" inputmode="decimal" placeholder="RIR"></div>`;return`<div class="card ${localStorage.getItem(dk(id))==='1'?'done':''}"><div class="name">${i+1}. ${e(n)}</div><div class="meta">${e(m)} · ${sets}×${e(reps)} · RIR ${e(rir)} · rest ${rest(rs)}</div><div class="cue">${e(cue)}</div><div class="setgrid">${rows}</div><div class="actions"><button class="btn restb" data-r="${rs}">休息</button><button class="btn primary doneb" data-id="${id}">${localStorage.getItem(dk(id))==='1'?'已完成 ✓':'完成 ✓'}</button></div></div>`}
function vols(){let all={},done={};Object.values(p.days).forEach(d=>d.x.forEach(x=>{let[id,,m,s]=x;if(m==='Other')return;all[m]=(all[m]||0)+Number(s);if(localStorage.getItem(dk(id))==='1')done[m]=(done[m]||0)+Number(s)}));let order=['Chest','Back','Side Delt','Biceps','Triceps','Quads','Hamstrings','Rear Delt','Front Delt','Calves','Abs'];return order.filter(m=>all[m]).map(m=>`<div class="vol"><b>${m}</b><div class="bar"><div class="fill" style="width:${Math.min(100,100*(done[m]||0)/all[m])}%"></div></div><span>${done[m]||0}/${all[m]}</span></div>`).join('')}
function train(){let d=p.days[day];trainEl.innerHTML=`<div class="title"><h2>Day ${day} — ${e(d.title)}</h2><span class="tag">${d.x.length} exercises</span></div><div class="box muted">Warm-up：5–8 min 輕量 cardio + 第一個大動作 2–4 組 ramp-up；warm-up sets 不計 working sets。</div>${d.x.map(card).join('')}<div class="card notice"><div class="name">Post-workout cardio</div><div class="cue">${e(d.cardio)}</div></div><div class="box"><b>Weekly direct volume</b>${vols()}<div class="muted">課表修改後會自動重新計算。</div><button id="resetDone" class="btn danger full" style="margin-top:8px">Reset weekly completion</button></div>`;document.querySelectorAll('.log').forEach(a=>{a.value=localStorage.getItem(a.dataset.k)||'';a.oninput=()=>localStorage.setItem(a.dataset.k,a.value)});document.querySelectorAll('.restb').forEach(b=>b.onclick=()=>setTimer(+b.dataset.r));document.querySelectorAll('.doneb').forEach(b=>b.onclick=()=>{let k=dk(b.dataset.id);localStorage.setItem(k,localStorage.getItem(k)==='1'?'0':'1');render()});resetDone.onclick=()=>{if(confirm('Reset completion? Weight/reps logs will stay.')){Object.keys(localStorage).filter(k=>k.startsWith('mf2done-')).forEach(k=>localStorage.removeItem(k));render()}}}
function editCard(x,i){let[id,n,m,sets,reps,rir,rs,cue]=x;return`<div class="card"><div class="name">${i+1}. ${e(n)}</div><div class="grid"><label class="field">Name<input data-f="1" data-i="${i}" value="${e(n)}"></label><label class="field">Muscle<select data-f="2" data-i="${i}">${MUS.map(z=>`<option ${z===m?'selected':''}>${z}</option>`).join('')}</select></label><label class="field">Sets<input data-f="3" data-i="${i}" type="number" min="1" max="20" value="${sets}"></label><label class="field">Reps<input data-f="4" data-i="${i}" value="${e(reps)}"></label><label class="field">RIR<input data-f="5" data-i="${i}" value="${e(rir)}"></label><label class="field">Rest sec<input data-f="6" data-i="${i}" type="number" min="30" max="600" value="${rs}"></label></div><label class="field" style="margin-top:7px">Cue<textarea data-f="7" data-i="${i}">${e(cue)}</textarea></label><div class="actions"><button class="btn up" data-i="${i}">↑</button><button class="btn down" data-i="${i}">↓</button><button class="btn danger del" data-i="${i}">刪除</button></div></div>`}
function edit(){let d=p.days[day];editEl.innerHTML=`<div class="title"><h2>編輯 Day ${day}</h2><span class="tag">Auto save</span></div><div class="box"><label class="field">Day title<input id="dayTitle" value="${e(d.title)}"></label><label class="field" style="margin-top:7px">Cardio<input id="cardio" value="${e(d.cardio)}"></label></div>${d.x.map(editCard).join('')}<button id="add" class="btn full green">＋ Add Exercise</button>`;document.querySelectorAll('[data-f]').forEach(a=>a.onchange=()=>{let i=+a.dataset.i,f=+a.dataset.f,v=a.value;if(f===3||f===6)v=Math.max(1,+v||1);p.days[day].x[i][f]=v;save();render()});document.querySelectorAll('.up').forEach(b=>b.onclick=()=>move(+b.dataset.i,-1));document.querySelectorAll('.down').forEach(b=>b.onclick=()=>move(+b.dataset.i,1));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(confirm('Delete '+p.days[day].x[i][1]+'?')){p.days[day].x.splice(i,1);save();render()}});dayTitle.onchange=()=>{d.title=dayTitle.value;save();render()};cardio.onchange=()=>{d.cardio=cardio.value;save();render()};add.onclick=()=>{p.days[day].x.push(['x'+Date.now().toString(36),'New Exercise','Other',2,'8–12','1–2',120,'']);save();render()}}
function move(i,n){let a=p.days[day].x,j=i+n;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function code(){codeEl.innerHTML=`<div class="title"><h2>課表 Code</h2><span class="tag">JSON</span></div><div class="box"><b>Export</b><div class="muted">Copy 呢段貼俾 ChatGPT，我可以直接按你目前課表改。</div><textarea id="out" class="code" readonly>${e(JSON.stringify(p,null,2))}</textarea><button id="copy" class="btn primary full">Copy Code</button></div><div class="box"><b>Import / Paste Code</b><div class="muted">可以貼完整 plan，亦可以貼 patch code。</div><textarea id="inc" class="code" placeholder='{"type":"patch","ops":[...]}'></textarea><button id="apply" class="btn primary full">Check & Apply</button><div id="msg" class="muted" style="margin-top:8px"></div></div><div class="box"><button id="resetPlan" class="btn danger full">Reset Science Baseline</button></div>`;copy.onclick=()=>{out.focus();out.select();document.execCommand('copy');copy.textContent='Copied ✓'};apply.onclick=importCode;resetPlan.onclick=()=>{if(confirm('Reset to default plan?')){p=cp(DEF);save();render()}}}
function importCode(){let o;try{o=JSON.parse(inc.value)}catch(err){msg.textContent='JSON error: '+err.message;return}if(valid(o)){p=o;save();msg.textContent='Full plan imported ✓';render();return}if(o.type==='patch'&&Array.isArray(o.ops)){let q=cp(p);for(let z of o.ops){if(!['A','B','C'].includes(z.day)){msg.textContent='Invalid day';return}let a=q.days[z.day].x,i=-1;if(z.id)i=a.findIndex(x=>x[0]===z.id);if(i<0&&z.name)i=a.findIndex(x=>x[1].toLowerCase()===String(z.name).toLowerCase());if(z.action==='update'){if(i<0){msg.textContent='Exercise not found';return}let map={name:1,muscle:2,sets:3,reps:4,rir:5,rest:6,cue:7};Object.entries(z.changes||{}).forEach(([k,v])=>{if(map[k])a[i][map[k]]=v})}else if(z.action==='delete'){if(i<0){msg.textContent='Exercise not found';return}a.splice(i,1)}else if(z.action==='add'){let x=z.exercise||{};a.splice(Number.isInteger(z.index)?z.index:a.length,0,[x.id||('x'+Date.now().toString(36)),x.name||'New Exercise',x.muscle||'Other',x.sets||2,x.reps||'8–12',x.rir||'1–2',x.rest||120,x.cue||''])}else if(z.action==='cardio'){q.days[z.day].cardio=z.value||q.days[z.day].cardio}else{msg.textContent='Unsupported patch action';return}}p=q;save();msg.textContent='Patch applied ✓';render();return}msg.textContent='Not a valid Muscle First plan/patch'}
const trainEl=document.getElementById('train'),editEl=document.getElementById('edit'),codeEl=document.getElementById('code');function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.d===day));train();edit();code();['train','edit','code'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==view))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setDay(b.dataset.d));document.querySelectorAll('.view').forEach(b=>b.onclick=()=>setView(b.dataset.v));
let base=120,left=120,tick=null;function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function draw(){clock.textContent=fmt(left)}function setTimer(s){clearInterval(tick);tick=null;base=left=s;draw();tbtn.textContent='開始'}function toggle(){if(tick){clearInterval(tick);tick=null;tbtn.textContent='繼續';return}if(left<=0)left=base;tbtn.textContent='暫停';tick=setInterval(()=>{left--;draw();if(left<=0){clearInterval(tick);tick=null;tbtn.textContent='再開始';navigator.vibrate?.([200,100,200])}},1000)}q90.onclick=()=>setTimer(90);tbtn.onclick=toggle;render();draw();
</script></body></html>
